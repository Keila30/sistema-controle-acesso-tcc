services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sistema-controle-acesso
    ports:
      - "5000:5000"
    environment:
      SECRET_KEY: ${SECRET_KEY:-dev-only-change-this-secret-key}
      FLASK_DEBUG: "0"
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-controle}:${POSTGRES_PASSWORD:-controle_dev}@db:5432/${POSTGRES_DB:-controle_acesso}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: sistema-controle-acesso-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-controle_acesso}
      POSTGRES_USER: ${POSTGRES_USER:-controle}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-controle_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data: